; flockr — example polybar module
;
; Shows every workspace as "N Name" plus one status logo for its agents:
;   !  needs you (red)   ✓ done, not yet seen (green)   ⠋ working (amber)   ○ idle
; Clicking a workspace switches to it. Use it instead of (or next to) internal/i3:
;   modules-left = flockr
; The focused workspace is underlined, so give the bar an underline size.

[module/flockr]
type = custom/script
exec = flockr bar
tail = true
format = <label>
label = %output%
format-padding = 0

[bar/example]
; ...
line-size = 2
modules-left = flockr
