# flockr — example i3 configuration
#
# Include it from your i3 config (i3 ≥ 4.22) and adjust to taste:
#     include ~/.config/i3/flockr.conf
# Every binding is an i3 binding, so it works even while a CLI agent has the
# keyboard. $mod is whatever your config sets (usually Mod4 = Super).

# --- the daemon ---------------------------------------------------------------
exec_always --no-startup-id flockr daemon

# --- terminals: open them as flockr terminals so they get a title and notes --
# Replace your terminal binding. From a binding, `flockr term` opens your
# default terminal ($TERMINAL, else x-terminal-emulator; `terminal` in
# ~/.config/flockr/config.toml overrides it) running a flockr session.
bindsym $mod+Return exec flockr term

# Agents waiting on you get the X urgency hint: i3 paints their title bar and
# workspace with client.urgent, e.g.
# client.urgent         #E53935 #E53935    #ffffff #E53935   #E53935

# --- agents ------------------------------------------------------------------
bindsym Mod1+slash exec --no-startup-id flockr label
bindsym Mod1+period exec --no-startup-id flockr notes
bindsym $mod+u exec --no-startup-id flockr next
bindsym Mod1+u exec --no-startup-id flockr unread
# focus flockr terminal N of this workspace (the number in its title bar)
bindsym Mod1+1 exec --no-startup-id flockr focus 1
bindsym Mod1+2 exec --no-startup-id flockr focus 2
bindsym Mod1+3 exec --no-startup-id flockr focus 3
bindsym Mod1+4 exec --no-startup-id flockr focus 4
bindsym Mod1+5 exec --no-startup-id flockr focus 5
bindsym Mod1+6 exec --no-startup-id flockr focus 6
bindsym Mod1+7 exec --no-startup-id flockr focus 7
bindsym Mod1+8 exec --no-startup-id flockr focus 8
bindsym Mod1+9 exec --no-startup-id flockr focus 9
# with dunst, `dunstctl action` on a flockr notification jumps to that agent
bindsym $mod+n exec --no-startup-id dunstctl action

# --- one workspace per project (optional, but it is what flockr is built for) --
# set $ws1 "1:Bookshelf"
# set $ws2 "2:Website"
