# flockr — example i3 configuration
#
# Include it from your i3 config (i3 ≥ 4.22) and adjust to taste:
#     include ~/.config/i3/flockr.conf
# Every binding is an i3 binding, so it works even while a CLI agent has the
# keyboard. $mod is whatever your config sets (usually Mod4 = Super).

# --- the daemon (also opens the sidebar) ------------------------------------
exec_always --no-startup-id flockr daemon

# --- terminals: open them as flockr terminals so they get a header and notes --
# Replace your terminal binding. From a binding, `flockr term` opens your
# default terminal ($TERMINAL, else x-terminal-emulator; `terminal` in
# ~/.config/flockr/config.toml overrides it) running a flockr session.
bindsym $mod+Return exec flockr term

# --- the sidebar window -------------------------------------------------------
for_window [class="flockr-sidebar"] floating enable, sticky enable, border none
no_focus [class="flockr-sidebar"]
bindsym $mod+b exec --no-startup-id flockr sidebar toggle

# --- slim stack/tab title bars ----------------------------------------------
# The sidebar lists every window, so stacked/tabbed title bars can shrink to
# thin coloured strips (urgent = red). Note: this font also sizes all other
# i3 title bars.
font pango:monospace 1
workspace_layout stacking
# client.<class>      border  background text    indicator child_border
client.focused        #40916c #2D6A4F    #f3f4f5 #2D6A4F   #2D6A4F
client.unfocused      #2f343f #2f343f    #676E7D #2f343f   #2f343f
client.focused_inactive #2f343f #3a3f4b  #676E7D #2f343f   #2f343f
client.urgent         #E53935 #E53935    #ffffff #E53935   #E53935

# --- agents ------------------------------------------------------------------
bindsym Mod1+slash exec --no-startup-id flockr label
bindsym Mod1+period exec --no-startup-id flockr notes
bindsym $mod+u exec --no-startup-id flockr next
# with dunst, `dunstctl action` on a flockr notification jumps to that agent
bindsym $mod+n exec --no-startup-id dunstctl action

# --- move the focused window to a position in its stack ----------------------
bindsym Mod1+Shift+1 exec --no-startup-id flockr slot 1
bindsym Mod1+Shift+2 exec --no-startup-id flockr slot 2
bindsym Mod1+Shift+3 exec --no-startup-id flockr slot 3
bindsym Mod1+Shift+4 exec --no-startup-id flockr slot 4
bindsym Mod1+Shift+5 exec --no-startup-id flockr slot 5
bindsym Mod1+Shift+6 exec --no-startup-id flockr slot 6
bindsym Mod1+Shift+7 exec --no-startup-id flockr slot 7
bindsym Mod1+Shift+8 exec --no-startup-id flockr slot 8
bindsym Mod1+Shift+9 exec --no-startup-id flockr slot 9

# --- one workspace per project (optional, but it is what flockr is built for) --
# set $ws1 "1:Bookshelf"
# set $ws2 "2:Website"
# bindsym $mod+1 workspace number $ws1
# bindsym $mod+Shift+1 move container to workspace number $ws1
